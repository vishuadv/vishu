<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1a73e8" />
  <title>Offline</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;padding:24px;background:#0f172a;color:#e2e8f0}
    .card{max-width:560px;margin:10vh auto;background:#111827;border:1px solid #243042;border-radius:12px;padding:18px}
    h1{margin:0 0 8px 0;font-size:20px}
    p{margin:0 0 12px 0;line-height:1.4;color:#cbd5e1}
    a{display:inline-block;padding:10px 14px;border-radius:10px;background:#1a73e8;color:white;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Cached pages can still open. If you submit a marked offline form, it will be queued and sent when internet returns.</p>
    <a href="/">Go to home</a>
  </div>
</body>
</html>
